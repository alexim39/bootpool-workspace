    :root {

    }
    html, body { height: 100%; margin: 0; }

    /* ---------- Shell ---------- */
    .app-splash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 99999; overflow: hidden;
      background:
        radial-gradient(120% 90% at 85% -10%, rgba(0,230,118,0.10) 0%, transparent 55%),
        radial-gradient(110% 85% at 0% 110%, rgba(232,185,35,0.08) 0%, transparent 55%),
        linear-gradient(180deg, var(--bp-navy) 0%, var(--bp-navy-2) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.45s ease, transform 0.45s ease, filter 0.45s ease;
    }
    .app-splash.splash-exit {
      opacity: 0; transform: scale(1.045); filter: blur(6px); pointer-events: none;
    }

    /* Dot-grid texture */
    .app-splash::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 34px 34px; pointer-events: none;
    }
    /* Faint football pitch centre-ring motif */
    .app-splash .s-pitch {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(92vw, 780px); aspect-ratio: 1; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.045);
      box-shadow: inset 0 0 0 90px rgba(255,255,255,0.012), inset 0 0 0 190px rgba(255,255,255,0.008);
      pointer-events: none; animation: pitchBreathe 9s ease-in-out infinite;
    }
    @keyframes pitchBreathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
    }

    /* Ambient orbs */
    .app-splash .s-orb {
      position: absolute; border-radius: 50%; pointer-events: none; filter: blur(2px);
    }
    .app-splash .s-orb-1 {
      top: -10%; right: -6%; width: min(58vw, 540px); aspect-ratio: 1;
      background: radial-gradient(circle, rgba(0,230,118,0.13) 0%, transparent 62%);
      animation: orbA 8s ease-in-out infinite;
    }
    .app-splash .s-orb-2 {
      bottom: -12%; left: -8%; width: min(54vw, 500px); aspect-ratio: 1;
      background: radial-gradient(circle, rgba(232,185,35,0.11) 0%, transparent 62%);
      animation: orbB 9s ease-in-out infinite;
    }
    .app-splash .s-orb-3 {
      top: 50%; left: 50%; width: min(36vw, 300px); aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(90,150,255,0.07) 0%, transparent 55%);
      animation: orbC 6s ease-in-out infinite;
    }
    @keyframes orbA {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(-40px, 30px) scale(1.12); }
      66% { transform: translate(25px, -35px) scale(0.92); }
    }
    @keyframes orbB {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(35px, -25px) scale(1.15); }
      66% { transform: translate(-30px, 30px) scale(0.88); }
    }
    @keyframes orbC {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    }

    /* ---------- Stage ---------- */
    .app-splash .s-stage {

    @keyframes stageIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }

    /* Shield emblem + radar rings */

    .app-splash .s-pool {

    /* ---------- Loader ---------- */

    .app-splash .s-pct {

    .app-splash .s-loader-hint {

      font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    }

    /* Checklist steps */
    .app-splash .s-steps {
      display: flex; flex-direction: column; gap: 0.45rem; margin-top: 1.35rem;
      min-width: min(74vw, 280px);
    }
    .app-splash .s-step {
      display: flex; align-items: center; gap: 0.6rem;
      color: rgba(255,255,255,0.35); font-size: 0.8rem; font-weight: 500;

    .app-splash .s-step .s-check {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;

    .app-splash .s-step .s-check svg { width: 9px; height: 9px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.25s ease; }
    .app-splash .s-step.on { color: rgba(255,255,255,0.85); }
    .app-splash .s-step.on .s-check { border-color: var(--bp-emerald); background: rgba(0,230,118,0.16); box-shadow: 0 0 12px rgba(0,230,118,0.35); }
    .app-splash .s-step.on .s-check svg { opacity: 1; }

    /* ---------- Feature pills ---------- */
    .app-splash .s-pills {
      position: absolute; bottom: clamp(1.2rem, 4vh, 2.2rem); left: 0; right: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 0.6rem; flex-wrap: wrap; padding: 0 1rem;
      opacity: 0; animation: taglineIn 0.6s ease 1.25s forwards;
    }
    .app-splash .s-pill {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.42rem 0.85rem; border-radius: 999px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.72); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.02em; backdrop-filter: blur(6px);
    }
    .app-splash .s-pill svg { width: 13px; height: 13px; flex-shrink: 0; }
    .app-splash .s-pill.p-emerald svg { stroke: var(--bp-emerald); }
    .app-splash .s-pill.p-gold svg { stroke: var(--bp-gold); }

    /* ---------- Reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {
      .app-splash .s-pitch, .app-splash .s-orb-1, .app-splash .s-orb-2, .app-splash .s-orb-3,
      .app-splash .s-ring, .app-splash .s-ring-2, .app-splash .s-ping, .app-splash .s-ping-2,
      .app-splash .s-shield { animation: none; }
      .app-splash .s-stage { animation: none; }
      .app-splash .s-bet, .app-splash .s-pool { animation: none; opacity: 1; transform: none; }
      .app-splash .s-underline { animation: none; width: 80px; }
      .app-splash .s-tagline, .app-splash .s-loader, .app-splash .s-pills { animation: none; opacity: 1; }
      .app-splash .s-ring-fg { transition: none; }
    }
  </style>

  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var pctEl = splash.querySelector('.s-pct-num');
      var ringEl = splash.querySelector('.s-ring-fg');
      var steps = Array.prototype.slice.call(splash.querySelectorAll('.s-step'));
      var C = 2 * Math.PI * 26;
      if (ringEl) ringEl.style.strokeDasharray = C;

      var dur = 1400, start = null;
      function frame(ts) {
        if (!start) start = ts;
        var p = Math.min(1, (ts - start) / dur);
        p = 1 - Math.pow(1 - p, 3);
        var n = Math.round(p * 100);
        if (pctEl) pctEl.textContent = n;
        if (ringEl) ringEl.style.strokeDashoffset = C * (1 - p);
        var active = n < 30 ? 1 : n < 65 ? 2 : 3;
        steps.forEach(function (s, i) { if (i < active) s.classList.add('on'); });
        if (p < 1) requestAnimationFrame(frame);
      }
      if (!reduced) requestAnimationFrame(frame);
      if (reduced) { if (pctEl) pctEl.textContent = 100; if (ringEl) ringEl.style.strokeDashoffset = 0; steps.forEach(function (s) { s.classList.add('on'); }); }

      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-exit');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 520);
      }

      var minWait = Date.now() + 900;
      var t = setInterval(function () {
        var root = document.querySelector('app-root');
        if (Date.now() >= minWait && root && root.children.length > 0) {
          clearInterval(t);
          hide();
        }
      }, 80);
      setTimeout(function () { clearInterval(t); hide(); }, 7000);
    })();
  </script>
