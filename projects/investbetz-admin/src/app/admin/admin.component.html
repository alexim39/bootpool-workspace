
    <div class="admin-shell">
      <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">
        <div class="sidebar-header">
          <div class="logo">
            <img src="logo.png" alt="BetPool" class="logo-img">
            <span class="logo-text" *ngIf="!sidebarCollapsed()">BetPool</span>
          </div>
          <button mat-icon-button class="toggle-btn" (click)="sidebarCollapsed.set(!sidebarCollapsed())">
            <mat-icon>{{ sidebarCollapsed() ? 'menu' : 'close' }}</mat-icon>
          </button>
        </div>

        <nav class="nav-list">
          @for (group of navGroups; track group.label) {
            <div class="nav-group" [class.expanded]="isGroupExpanded(group.label)">
              <button type="button" class="nav-group-btn"
                      [class.active]="groupActive(group.label)"
                      (click)="toggleGroup(group.label)"
                      [title]="group.label"
                      [attr.aria-expanded]="isGroupExpanded(group.label)">
                <mat-icon class="nav-icon">{{ group.icon }}</mat-icon>
                <span class="nav-label" *ngIf="!sidebarCollapsed()">{{ group.label }}</span>
                <mat-icon class="nav-chevron" *ngIf="!sidebarCollapsed()">chevron_right</mat-icon>
              </button>
              @if (!sidebarCollapsed()) {
                <div class="nav-group-items">
                  @for (item of group.items; track item.path) {
                    <a class="nav-item" [routerLink]="item.path"
                       routerLinkActive="active"
                       [routerLinkActiveOptions]="{ exact: item.exact }"
                       [title]="item.label">
                      <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
                      <span class="nav-label">{{ item.label }}</span>
                      <span class="nav-badge" *ngIf="item.badge && pendingTotal > 0">{{ pendingTotal }}</span>
                    </a>
                  }
                </div>
              }
            </div>
          }
        </nav>

        <div class="sidebar-footer">
          <div class="user-info" *ngIf="!sidebarCollapsed()">
            <div class="avatar">{{ (user()?.fullName || 'A')[0] }}</div>
            <div class="user-details">
              <div class="user-name">{{ user()?.fullName || 'Admin' }}</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
          <button mat-icon-button class="logout-btn" title="Logout" (click)="auth.logout()">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      </aside>

      <main class="main-content" [class.expanded]="sidebarCollapsed()">
        <div class="route-loader" *ngIf="routeLoading()">
          <mat-spinner diameter="32"></mat-spinner>
        </div>
        <router-outlet />
      </main>
    </div>
