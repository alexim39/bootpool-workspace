<div class="share-overlay" *ngIf="open()" (click)="close()"></div>
<div class="share-sheet" *ngIf="open()" role="dialog" aria-modal="true" aria-label="Share profile">
  <div class="share-handle"></div>
  <div class="share-head">
    <div class="share-orb"></div>
    <h3>Share {{ profile().name }}'s profile</h3>
    <p class="share-sub">{{ shareText() }}</p>
    <button mat-icon-button class="share-close" (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="share-grid">
    <button class="share-btn wa" (click)="shareWhatsApp()">
      <span class="share-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12.04 2a10 10 0 0 0-8.56 15.08L2 22l5.07-1.33A10 10 0 1 0 12.04 2Zm0 17.5a7.5 7.5 0 0 1-3.83-1.05l-.27-.16-3.01.79.79-2.93-.18-.3A7.5 7.5 0 1 1 12.04 19.5Zm4.2-5.63c-.23-.12-1.37-.68-1.58-.76-.21-.08-.36-.12-.51.12-.15.23-.59.76-.72.91-.13.15-.27.17-.5.06-.23-.12-.97-.36-1.85-1.14-.68-.61-1.14-1.36-1.27-1.59-.13-.23-.01-.36.1-.47.1-.1.23-.27.34-.4.12-.13.15-.23.23-.38.08-.15.04-.28-.02-.4-.06-.12-.51-1.23-.7-1.69-.18-.43-.37-.37-.51-.38l-.44-.01a.86.86 0 0 0-.62.29c-.21.23-.82.8-.82 1.95s.84 2.26.96 2.42c.12.15 1.66 2.53 4.02 3.55.56.24 1 .38 1.34.49.56.18 1.07.15 1.47.09.45-.07 1.37-.56 1.56-1.1.19-.54.19-1 .13-1.1-.06-.1-.23-.15-.46-.27Z"/></svg>
      </span>
      <span>WhatsApp</span>
    </button>

    <button class="share-btn tg" (click)="shareTelegram()">
      <span class="share-icon"><mat-icon>send</mat-icon></span>
      <span>Telegram</span>
    </button>

    <button class="share-btn tw" (click)="shareTwitter()">
      <span class="share-icon">𝕏</span>
      <span>X / Twitter</span>
    </button>

    <button class="share-btn fb" (click)="shareFacebook()">
      <span class="share-icon">f</span>
      <span>Facebook</span>
    </button>

    <button class="share-btn ig" (click)="shareInstagram()">
      <span class="share-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span>Instagram</span>
    </button>

    <button class="share-btn tt" (click)="shareTikTok()">
      <span class="share-icon">♪</span>
      <span>TikTok</span>
    </button>

    <button class="share-btn copy" (click)="copyLink()">
      <span class="share-icon"><mat-icon>link</mat-icon></span>
      <span>Copy link</span>
    </button>

    <button class="share-btn native" (click)="nativeShare()">
      <span class="share-icon"><mat-icon>share</mat-icon></span>
      <span>More…</span>
    </button>
  </div>

  <div class="share-link-row">
    <span class="share-link">{{ shareUrl() }}</span>
    <button mat-stroked-button class="share-copy-sm" (click)="copyLink()">
      <mat-icon>content_copy</mat-icon> Copy
    </button>
  </div>
  <p class="share-hint">Tip: Instagram &amp; TikTok links copy to clipboard — paste in bio, story, or DM to share.</p>
</div>
